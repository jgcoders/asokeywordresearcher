<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Opportunity Finder</title>
<meta name="description" content="Find App Store niches and keywords where users pay and competition is beatable.">
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Opportunity">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <h1 id="viewTitle">Niches</h1>
      <label class="country">
        <span class="sr-only" data-i18n="Country">Country</span>
        <select id="country"></select>
      </label>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Sections" data-i18n-label="Sections">
    <a href="#niches" data-tab="niches">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span data-i18n="Niches">Niches</span>
    </a>
    <a href="#keyword" data-tab="keyword">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <span data-i18n="Keyword tab">Keyword</span>
    </a>
    <a href="#compare" data-tab="compare">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
      <span data-i18n="Countries">Countries</span>
    </a>
    <a href="#ideas" data-tab="ideas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1V17h5v-1.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z"/></svg>
      <span data-i18n="Ideas">Ideas</span>
    </a>
    <a href="#saved" data-tab="saved">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
      <span data-i18n="Saved">Saved</span>
    </a>
  </nav>

  <dialog id="sheet" class="sheet" aria-label="App details" data-i18n-label="App details"></dialog>
  <dialog id="tip" class="tip" aria-label="What does this mean?" data-i18n-label="What does this mean?"></dialog>
  <dialog id="welcome" class="welcome" aria-label="Welcome" data-i18n-label="Welcome"></dialog>

  <button id="guideFab" class="guide-fab" type="button"></button>
  <div id="guideBackdrop" class="guide-backdrop"></div>
  <aside id="guidePanel" class="guide-panel" aria-label="Guide" data-i18n-label="Guide"></aside>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

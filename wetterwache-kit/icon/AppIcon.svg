<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#14365E"/>
      <stop offset="1" stop-color="#0E6B66"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D5E6EE"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD15C"/>
      <stop offset="1" stop-color="#FF9A1F"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#06202F" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- soft ring, a "watch" around the storm -->
  <circle cx="512" cy="500" r="360" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="28"/>
  <!-- cloud -->
  <g filter="url(#shadow)">
    <path fill="url(#cloud)" d="M300 560
      c-64 0 -112 -48 -112 -108 c0 -58 44 -104 100 -108
      c14 -86 88 -148 176 -148 c70 0 132 40 160 102
      c14 -4 30 -6 46 -6 c84 0 150 64 150 144 c0 72 -56 124 -128 124 z"/>
  </g>
  <!-- rain -->
  <g stroke="#9FD4E6" stroke-width="26" stroke-linecap="round" opacity="0.9">
    <line x1="330" y1="640" x2="304" y2="706"/>
    <line x1="420" y1="660" x2="394" y2="726"/>
    <line x1="660" y1="640" x2="634" y2="706"/>
    <line x1="742" y1="610" x2="716" y2="676"/>
  </g>
  <!-- lightning bolt -->
  <g filter="url(#glow)">
    <path fill="url(#bolt)" stroke="#FFF3D1" stroke-width="10" stroke-linejoin="round"
      d="M560 470 L452 640 L532 640 L478 820 L640 590 L556 590 L612 470 Z"/>
  </g>
</svg>
